name: Publish Sanity project

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/projects/*.json'
      - 'scripts/publish-sanity-project.mjs'
      - '.github/workflows/publish-sanity-project.yml'
  push:
    branches: [main]
    paths:
      - 'content/projects/*.json'
  workflow_dispatch:
    inputs:
      project_file:
        description: 'Path under content/projects/, e.g. content/projects/my-project.json'
        type: string
        required: true
      publish:
        description: 'Publish to LIVE Sanity production (leave unchecked to validate only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sanity-project-publishing
  cancel-in-progress: false

jobs:
  project:
    name: Validate and publish approved projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine changed project files
        shell: bash
        env:
          PROJECT_FILE: ${{ inputs.project_file }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git diff --name-only --diff-filter=ACMR "${BEFORE_SHA}" HEAD -- 'content/projects/*.json' > /tmp/sanity-project-files
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMR "origin/${BASE_BRANCH}...HEAD" -- 'content/projects/*.json' > /tmp/sanity-project-files
          else
            printf '%s\n' "${PROJECT_FILE}" > /tmp/sanity-project-files
          fi
          echo "Project files:"
          cat /tmp/sanity-project-files
      - name: Prepare Biashara OS portfolio images
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BIASHARA_GITHUB_READ_TOKEN: ${{ secrets.BIASHARA_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          if ! grep -qx 'content/projects/biashara-os.json' /tmp/sanity-project-files; then
            exit 0
          fi
          if [[ -z "${BIASHARA_GITHUB_READ_TOKEN}" ]]; then
            echo "::error::Set BIASHARA_GITHUB_READ_TOKEN as an Actions secret with Actions:read permission to private jkidune/biashara-os."
            exit 1
          fi
          # Resolve the latest successful private capture instead of using an expiring artifact ID.
          curl --silent --show-error --fail --retry 2 \
            -H "Authorization: Bearer ${BIASHARA_GITHUB_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/jkidune/biashara-os/actions/runs?event=pull_request&per_page=60' \
            > /tmp/biashara-runs.json
          python3 - <<'PY'
          import json, sys
          data=json.load(open('/tmp/biashara-runs.json'))
          runs=[r for r in data.get('workflow_runs',[]) if r.get('name')=='Capture Biashara OS portfolio' and r.get('conclusion')=='success']
          if not runs: sys.exit('No successful Biashara OS capture found. Run its capture-portfolio workflow first.')
          print(runs[0]['id'],file=open('/tmp/biashara-run-id','w'))
          PY
          run_id="$(cat /tmp/biashara-run-id)"
          curl --silent --show-error --fail --retry 2 \
            -H "Authorization: Bearer ${BIASHARA_GITHUB_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jkidune/biashara-os/actions/runs/${run_id}/artifacts" \
            > /tmp/biashara-artifacts.json
          python3 - <<'PY'
          import json,sys
          items=json.load(open('/tmp/biashara-artifacts.json')).get('artifacts',[])
          artifact=next((a for a in items if a['name']=='biashara-portfolio-screens' and not a.get('expired')),None)
          if not artifact:sys.exit('Screenshot artifact expired or missing; rerun private screenshot workflow.')
          print(artifact['id'],file=open('/tmp/biashara-artifact-id','w'))
          PY
          artifact_id="$(cat /tmp/biashara-artifact-id)"
          curl --location --silent --show-error --fail --retry 2 \
            -H "Authorization: Bearer ${BIASHARA_GITHUB_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/jkidune/biashara-os/actions/artifacts/${artifact_id}/zip" \
            -o /tmp/biashara-screens.zip
          mkdir -p tmp/biashara-screens
          unzip -j -o -q /tmp/biashara-screens.zip '*.png' -d tmp/biashara-screens
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/build-biashara-portfolio.py
      - name: Render approved Checkpoint product boards from public source
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qx 'content/projects/checkpoint.json' /tmp/sanity-project-files; then
            exit 0
          fi
          # This public source commit has passed Checkpoint's isolated Playwright
          # capture tests. Pin it to prevent unexpected asset changes.
          source_sha="c2ebed1c1d2b5193cab5919aac88af0514794370"
          # Keep the Vite project outside the Barons Next.js tree so its build
          # cannot inherit Barons' unrelated root PostCSS configuration.
          git clone --quiet https://github.com/jkidune/checkpoint-dashboard.git /tmp/checkpoint-source
          git -C /tmp/checkpoint-source checkout --quiet "${source_sha}"
          npm ci --prefix /tmp/checkpoint-source/marketing --no-audit --no-fund
          npm install --prefix /tmp/checkpoint-source/frontend --no-save --package-lock=false --no-audit --no-fund
          npm install --prefix /tmp/checkpoint-source/scripts/portfolio --no-audit --no-fund
          /tmp/checkpoint-source/scripts/portfolio/node_modules/.bin/playwright install --with-deps chromium
          (
            cd /tmp/checkpoint-source
            (cd marketing && npm run dev -- --host 127.0.0.1 --port 4321) >/tmp/checkpoint-marketing.log 2>&1 &
            (cd frontend && VITE_API_BASE_URL=/api npm run dev -- --host 127.0.0.1 --port 5173) >/tmp/checkpoint-frontend.log 2>&1 &
            for port in 4321 5173; do
              ready=0
              for i in $(seq 1 55); do
                if curl --silent --fail "http://127.0.0.1:${port}/" >/dev/null; then
                  ready=1
                  break
                fi
                sleep 1
              done
              if [[ ${ready} -ne 1 ]]; then
                cat /tmp/checkpoint-marketing.log /tmp/checkpoint-frontend.log
                exit 1
              fi
            done
            node scripts/portfolio/capture.mjs
            python3 -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.8.2
            python3 scripts/portfolio/build_boards.py
          )
          mkdir -p content/projects/assets/checkpoint
          cp /tmp/checkpoint-source/portfolio-captures/boards/*.jpg content/projects/assets/checkpoint/
          test "$(find content/projects/assets/checkpoint -name '*.jpg' | wc -l)" -eq 7
          echo "Seven Checkpoint portfolio images generated with fictional demo records."
      - name: Validate project content and image sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && ( "$file" == "content/projects/biashara-os.json" || "$file" == "content/projects/checkpoint.json" ) ]]; then
              node --check scripts/publish-sanity-project.mjs
              python3 -m py_compile scripts/build-biashara-portfolio.py
              python3 -m json.tool "$file" >/dev/null
              echo "Generated-asset project JSON and publisher syntax checked; images render on approved main runs."
            else
              node scripts/publish-sanity-project.mjs --file "$file" --check --check-sources
            fi
          done < /tmp/sanity-project-files
      - name: Publish reviewed projects to Sanity production
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        shell: bash
        env:
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SANITY_API_WRITE_TOKEN}" ]]; then
            echo "::error::SANITY_API_WRITE_TOKEN is not configured."
            exit 1
          fi
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            node scripts/publish-sanity-project.mjs --file "$file" --publish
          done < /tmp/sanity-project-files
